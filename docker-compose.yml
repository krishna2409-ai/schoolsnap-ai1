# ╔══════════════════════════════════════════════════════════════════════╗
# ║  SchoolSnap AI — Production Docker Compose                         ║
# ║                                                                     ║
# ║  Architecture:                                                      ║
# ║  ┌─────────────────────────────────────────────────────────────┐    ║
# ║  │                    GATEWAY (Nginx :80)                      │    ║
# ║  │  /           → V1 Frontend                                 │    ║
# ║  │  /investor/  → V2 Frontend                                 │    ║
# ║  │  /api/*      → Backend API                                 │    ║
# ║  └──────┬──────────────┬──────────────┬────────────────────────┘    ║
# ║         │              │              │                             ║
# ║    ┌────▼────┐   ┌─────▼─────┐  ┌────▼────┐                       ║
# ║    │   V1    │   │    V2     │  │ Backend │                        ║
# ║    │ Nginx   │   │  Nginx   │  │ FastAPI │                        ║
# ║    │  :80    │   │   :80    │  │  :8000  │                        ║
# ║    └─────────┘   └──────────┘  └────┬────┘                        ║
# ║                                      │                             ║
# ║                              ┌───────▼───────┐                     ║
# ║                              │  Data Volume   │                    ║
# ║                              │  SQLite+FAISS  │                    ║
# ║                              │  +Images       │                    ║
# ║                              └────────────────┘                    ║
# ╚══════════════════════════════════════════════════════════════════════╝

services:

  # ═══ BACKEND — FastAPI + FAISS + SQLite ═══════════════════════════
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: snap-backend
    restart: unless-stopped
    environment:
      - ENVIRONMENT=production
      - SECRET_KEY=${SECRET_KEY:-schoolsnap-prod-key-$(date +%s)}
      - DEBUG=False
      - CORS_ORIGINS=*
      - RATE_LIMIT_ENABLED=true
      - LOG_LEVEL=INFO
    volumes:
      - ./backend/images:/app/images
      - ./backend/faiss_store:/app/faiss_store
      - ./backend/schoolsnap.db:/app/schoolsnap.db
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - snap-internal
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"
        reservations:
          memory: 512M

  # ═══ V1 — Base Parent Portal (Nginx) ══════════════════════════════
  v1:
    build:
      context: ./v1
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
    container_name: snap-v1
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - snap-internal
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.5"

  # ═══ V2 — Investor Aether Suite (Nginx) ═══════════════════════════
  v2:
    build:
      context: ./v2
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
    container_name: snap-v2
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - snap-internal
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.5"

  # ═══ GATEWAY — Nginx Reverse Proxy ════════════════════════════════
  gateway:
    image: nginx:1.27-alpine
    container_name: snap-gateway
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT:-80}:80"
      - "443:443"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./gateway/50x.html:/usr/share/nginx/html/50x.html:ro
      - ./gateway/ssl:/etc/nginx/ssl:ro
    depends_on:
      v1:
        condition: service_healthy
      v2:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - snap-internal
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: "0.25"

# ═══ NETWORKS ═══════════════════════════════════════════════════════
networks:
  snap-internal:
    driver: bridge
