# ╔══════════════════════════════════════════════════════════════════════╗
# ║  SchoolSnap AI — Gateway Reverse Proxy (Nginx)                     ║
# ║  Routes: / → V1 | /investor → V2 | /api → Backend                 ║
# ╚══════════════════════════════════════════════════════════════════════╝

upstream backend {
    server backend:8000;
}

upstream v1_frontend {
    server v1:80;
}

upstream v2_frontend {
    server v2:80;
}

# ── Rate limiting zones ──────────────────────────────────────────────
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=upload:10m rate=5r/s;

server {
    listen 80;
    server_name _;

    # Redirect all HTTP requests to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate /etc/nginx/ssl/server.crt;
    ssl_certificate_key /etc/nginx/ssl/server.key;
    
    # ── SSL Hardening ──────────────────────────────────────────────────
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # ── Global Settings ──────────────────────────────────────────────
    client_max_body_size 100M;
    proxy_read_timeout 120s;
    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;

    # ── Gzip ─────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/javascript application/json application/xml
        image/svg+xml;

    # ── Security Headers ─────────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ── API Backend ──────────────────────────────────────────────────
    # All /api/ requests → backend (strip /api prefix)
    location /api/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://backend/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Upload endpoints get tighter rate limits
    location /api/upload-event-images {
        limit_req zone=upload burst=3 nodelay;
        proxy_pass http://backend/upload-event-images;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Health check (direct, no rate limit)
    location = /api/health {
        proxy_pass http://backend/health;
    }

    # ── V2 Investor & Version 2 Portal ───────────────────────────────
    # Route both /investor/ and /v2/ to the standalone V2 frontend
    location ~ ^/(investor|v2)/ {
        rewrite ^/(investor|v2)/(.*)$ /$2 break;
        proxy_pass http://v2_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    location ~ ^/(investor|v2)$ {
        return 301 /$1/;
    }

    # ── V1 Base Portal (Default) ─────────────────────────────────────
    # Everything else → V1 frontend
    location / {
        proxy_pass http://v1_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ── Static image assets from backend ─────────────────────────────
    location /images/ {
        proxy_pass http://backend/images/;
        proxy_cache_valid 200 1h;
        expires 1h;
        add_header Cache-Control "public";
    }

    # ── Error pages ──────────────────────────────────────────────────
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}
